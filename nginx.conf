server {
  listen 80;
  server_name _;
  resolver 127.0.0.11 valid=10s;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://host.docker.internal:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /vnc/chrome/ {
    set $chrome_upstream chrome:6080;
    rewrite ^/vnc/chrome/(.*)$ /$1 break;
    proxy_pass http://$chrome_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400;
  }

  location /vnc/firefox/ {
    set $firefox_upstream firefox:6080;
    rewrite ^/vnc/firefox/(.*)$ /$1 break;
    proxy_pass http://$firefox_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
