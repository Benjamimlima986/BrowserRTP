plugins {
    id 'com.android.application'
}

android {
    namespace 'com.browserrtp.displaymanager'
    compileSdk 35

    defaultConfig {
        applicationId 'com.browserrtp.displaymanager'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'org.tukaani:xz:1.10'
}
