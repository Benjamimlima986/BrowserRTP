services:
  nginx:
    image: nginx:alpine
    container_name: browserrtp-nginx
    ports:
      - "8080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./styles.css:/usr/share/nginx/html/styles.css:ro
      - ./app.js:/usr/share/nginx/html/app.js:ro
    depends_on:
      - chrome
    restart: unless-stopped

  chrome:
    build:
      context: ./docker/browser
      args:
        BROWSER: chromium
    container_name: browserrtp-chrome
    shm_size: 2gb
    environment:
      DISPLAY: ":99"
      BROWSER_NAME: "Chromium"
    restart: unless-stopped

  firefox:
    build:
      context: ./docker/browser
      args:
        BROWSER: firefox
    container_name: browserrtp-firefox
    shm_size: 2gb
    environment:
      DISPLAY: ":99"
      BROWSER_NAME: "Firefox"
    restart: unless-stopped
